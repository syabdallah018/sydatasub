<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Supersonic Launch Optimizations -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SY DATA SUB</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      color: #ffffff;
      overflow: hidden;
    }
    #loading-indicator {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(255, 255, 255, 0.12);
      border-top: 3.5px solid #2563EB;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 18px;
    }
    .logo-text {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin-bottom: 5px;
      color: #F8FAFC;
    }
    .sub-text {
      font-size: 12.5px;
      color: #94A3B8;
      font-weight: 500;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div class="logo-text">SY DATA SUB</div>
    <div class="sub-text">Loading app securely...</div>
  </div>

  <script>
    function removeLoader() {
      var el = document.getElementById("loading-indicator");
      if (el) {
        el.style.opacity = "0";
        setTimeout(function() { el.remove(); }, 300);
      }
    }

    var obs = new MutationObserver(function(mutations) {
      for (var i = 0; i < mutations.length; i++) {
        for (var j = 0; j < mutations[i].addedNodes.length; j++) {
          var n = mutations[i].addedNodes[j];
          if (n.nodeName === "FLUTTER-VIEW" || n.nodeName === "FLT-GLASS-PANE" || n.nodeName === "CANVAS") {
            removeLoader();
            obs.disconnect();
            return;
          }
        }
      }
    });
    obs.observe(document.body, { childList: true, subtree: true });
    window.addEventListener("flutter-first-frame", removeLoader);
    setTimeout(removeLoader, 1800);

    window.injectSession = function(token, userObj) {
      if (token) {
        localStorage.setItem("flutter.auth_token", JSON.stringify(token));
      }
      if (userObj) {
        if (userObj.phone) localStorage.setItem("flutter.saved_phone", JSON.stringify(userObj.phone));
        localStorage.setItem("flutter.cached_user_json", JSON.stringify(JSON.stringify(userObj)));
      }
    };

    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var token = params.get('token');
        if (token) {
          window.injectSession(token);
        }
      } catch (_) {}
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
